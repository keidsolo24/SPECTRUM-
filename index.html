<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Aurora</title>
<meta name="description" content="Aurora — your day, cards, board and plan.">
<meta name="theme-color" content="#2c4770">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aurora">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preload" href="fonts/inter-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css?v=2">
</head>
<body>
<div id="bg" aria-hidden="true"><img class="wall" id="wallImg" src="wall.jpg" alt=""><div class="dim" id="wallDim"></div><div class="aura"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div></div>
<main id="app">
  <section class="scr" id="s-home" aria-label="Home"></section>
  <section class="scr" id="s-spaces" aria-label="Spaces"></section>
  <section class="scr" id="s-board" aria-label="Board"></section>
  <section class="scr" id="s-plan" aria-label="Plan"></section>
  <section class="scr push" id="s-card" aria-label="Card"></section>
  <section class="scr push" id="s-settings" aria-label="Settings"></section>
</main>
<nav class="nav" id="nav" aria-label="Main">
  <div class="bar frost" role="tablist"></div>
  <button class="plus cr press" id="plusBtn" aria-label="Add"></button>
</nav>
<div id="scrim"></div>
<div id="sheet" class="frost" role="dialog" aria-modal="true"></div>
<div id="viewer" role="dialog" aria-modal="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="vlayer" role="dialog" aria-modal="true"></div>
<div id="welcome"></div>
<input type="file" id="fileIn" accept="image/*,video/*" hidden>
<input type="file" id="wallIn" accept="image/*" hidden>
<input type="file" id="restoreIn" accept="application/json,.json" hidden>
<script src="js/core.js?v=2"></script>
<script src="js/ui.js?v=2"></script>
<script src="js/screens.js?v=2"></script>
<script src="js/sheets.js?v=2"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
